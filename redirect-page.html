<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang chuyển hướng...</title>
<!-- CSS cô lập hoàn toàn - Có thể chèn vào thẻ <style> hoặc file .css của bạn -->
<style>
    /* Toàn bộ thuộc tính chỉ có tác dụng bên trong vùng .rd-wrapper */
    .rd-wrapper {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0f172a; /* Màu nền màn hình chuyển hướng */
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999; /* Đảm bảo đè lên mọi thành phần khác của web */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .rd-wrapper * {
        box-sizing: border-box;
    }

    .rd-container {
        text-align: center;
        padding: 2rem;
        max-width: 450px;
        width: 100%;
    }

    .rd-loader {
        width: 50px;
        height: 50px;
        border: 5px solid #334155;
        border-top: 5px solid #38bdf8;
        border-radius: 50%;
        margin: 0 auto 1.5rem;
        animation: rd-spin 1s linear infinite;
    }

    .rd-title {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #f8fafc !important; /* Giữ màu chữ chuẩn kể cả khi có css khác ghi đè */
    }

    .rd-text {
        color: #94a3b8 !important;
        font-size: 1rem;
        margin-bottom: 1.5rem;
    }

    .rd-countdown {
        font-weight: bold;
        color: #38bdf8 !important;
        font-size: 1.2rem;
    }

    .rd-btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #38bdf8;
        color: #0f172a !important;
        text-decoration: none;
        border-radius: 0.375rem;
        font-weight: 600;
        font-size: 0.875rem;
        transition: background-color 0.2s;
        opacity: 0;
        animation: rd-fadeIn 1s forwards;
        animation-delay: 2s;
    }

    .rd-btn:hover {
        background-color: #7dd3fc;
    }

    /* Đổi tên Keyframes để tránh trùng lặp hệ thống */
    @keyframes rd-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @keyframes rd-fadeIn {
        to { opacity: 1; }
    }
</style>
</head>
<body>
<!-- Khối HTML chuyển hướng - Đặt ở cuối thẻ <body> của trang web hiện tại -->
<div class="rd-wrapper">
    <div class="rd-container">
        <div class="rd-loader"></div>
        <h1 class="rd-title">Đang chuyển hướng bạn đi tiếp</h1>
        <p class="rd-text">Vui lòng đợi trong <span class="rd-countdown" id="rd-countdown-num">10</span> giây...</p>
        <a href="#" id="rd-fallback-btn" class="rd-btn">Chuyển hướng ngay</a>
    </div>
</div>

<script>
{
    // Sử dụng Block Scope {} để cô lập hoàn toàn các biến bên trong
    const targetUrls = [
        "https://www.google.com",
        "https://www.wikipedia.org",
        "https://github.com",
        "https://archive.org",
        "https://www.youtube.com"
    ];

    const randomIndex = Math.floor(Math.random() * targetUrls.length);
    const chosenUrl = targetUrls[randomIndex];

    // Cấu hình nút bấm dự phòng
    const fallbackBtn = document.getElementById('rd-fallback-btn');
    if (fallbackBtn) {
        fallbackBtn.href = chosenUrl;
    }

    // Xử lý bộ đếm ngược
    let secondsLeft = 10;
    const countdownEl = document.getElementById('rd-countdown-num');

    const redirectTimer = setInterval(() => {
        secondsLeft--;
        if (countdownEl) {
            countdownEl.textContent = secondsLeft;
        }

        if (secondsLeft <= 0) {
            clearInterval(redirectTimer);
            window.location.href = chosenUrl;
        }
    }, 1000);
}
</script>
</body>
</html>
